<script>
  // ── API KEY MANAGEMENT ──────────────────────────────────────────────
  function saveKey() {
    const val = document.getElementById('api-key-input').value.trim();
    const err = document.getElementById('api-err');
    if (!val.startsWith('sk-ant-')) { err.style.display = 'block'; return; }
    err.style.display = 'none';
    localStorage.setItem('drbio_api_key', val);
    document.getElementById('api-gate').style.display = 'none';
  }
  function getKey() { return localStorage.getItem('drbio_api_key') || ''; }
  // Show gate only if no key saved
  if (getKey()) document.getElementById('api-gate').style.display = 'none';
</script>

async function claude(prompt,sys=""){
  const key=getKey();
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys||"You are DrBio, an expert NEET biology content creator. Create content that builds awareness, engagement, and generates leads. Be science-accurate, student-friendly, and exam-focused. Use Hook→Awareness→Value→Engagement→CTA framework.",messages:[{role:"user",content:prompt}]})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content?.map(b=>b.text||"").join("")||"";
}

    <select style={s.sel} value={tone} onChange={e=>setTone(e.target.value)}>{["educational + engaging","storytelling","exam-focused","motivational","simple & visual","Kannada-English mixed","advanced & analytical"].map(t=><option key={t}>{t}</option>)}</select>
    <label style={s.lbl}>Commands</label>
    <div style={{marginBottom:12}}>{[["","None"],["/analyze","Deep Analyze"],["/optimize","Optimize Draft"]].map(([c,l])=><span key={c} style={s.cmdBadge(cmd===c)} onClick={()=>setCmd(cmd===c?"":c)}>{l}</span>)}</div>
    {(cmd==="/optimize"||cmd==="/analyze")&&<><label style={s.lbl}>{cmd==="/optimize"?"Paste content to optimize":"Additional context"}</label><textarea style={{...s.ta,minHeight:70,marginBottom:12}} value={extra} onChange={e=>setExtra(e.target.value)} placeholder={cmd==="/optimize"?"Paste your draft here...":"Any specific angle or requirement..."}/></>}
    <button style={s.btn} onClick={generate} disabled={loading}>{loading?<><Loader/>Generating...</>:"Generate Content"}</button>
    {out&&<div style={s.out}>{out}<div style={{marginTop:14,display:"flex",gap:8}}><button style={s.btnSm} onClick={()=>{setCmd("/optimize");setExtra(out);}}>Optimize ↗</button><button style={s.btnSm} onClick={()=>navigator.clipboard?.writeText(out)}>Copy</button></div></div>}
  </div>);
}

// ── CONTENT ANALYZER ────────────────────────────────────────────────────
function ContentAnalyzer(){
  const [content,setContent]=useState("");
  const [platform,setPlatform]=useState("YouTube");
  const [loading,setLoading]=useState(false);
  const [out,setOut]=useState("");
  async function analyze(){
    if(!content.trim())return;
    setLoading(true);setOut("");
    try{setOut(await claude(`DEEP ANALYSIS — ${platform} content for DrBio NEET Biology channel:\n\n${content}\n\nAnalyze: 1) Hook strength /10 2) First 30 sec effectiveness 3) PYQ relevance & exam weight 4) Awareness→Engagement→Lead Gen framework 5) Platform optimization 6) Demographics fit (NEET 15–22) 7) Psychographics: aspirations/fears/motivations 8) CTA effectiveness 9) SEO score 10) Top 5 improvements 11) Overall score /100`,"You are a NEET content strategist. Sharp, specific, actionable analysis based on DrBio's production style."));}catch(e){setOut("Error: "+e.message);}
    setLoading(false);
  }
  return(<div>
    <label style={s.lbl}>Platform</label>
    <select style={s.sel} value={platform} onChange={e=>setPlatform(e.target.value)}>{["YouTube","Instagram","LinkedIn"].map(p=><option key={p}>{p}</option>)}</select>
    <label style={s.lbl}>Paste content for deep analysis</label>
    <textarea style={{...s.ta,minHeight:130,marginBottom:14}} value={content} onChange={e=>setContent(e.target.value)} placeholder="Paste video script, caption, reel hook, or any content..."/>
    <button style={s.btn} onClick={analyze} disabled={loading||!content.trim()}>{loading?<><Loader/>Analyzing...</>:"/analyze — Deep Analysis"}</button>
    {out&&<div style={s.out}>{out}</div>}
  </div>);
}

// ── PRODUCTION HUB ──────────────────────────────────────────────────────
function ProductionHub(){
  const [subtab,setSubtab]=useState("calendar");
  const [checks,setChecks]=useState(Array(8).fill(false));
  const [recChecks,setRecChecks]=useState(Array(6).fill(false));
  const [editChecks,setEditChecks]=useState(Array(6).fill(false));
  const [statuses,setStatuses]=useState(Array(9).fill("Plan"));
  const [scriptTopic,setScriptTopic]=useState("");
  const [loading,setLoading]=useState(false);
  const [out,setOut]=useState("");
  const toggle=(arr,set,i)=>{const n=[...arr];n[i]=!n[i];set(n);};
  const cycleStatus=i=>{const c=["Plan","In Progress","Done"];const n=[...statuses];n[i]=c[(c.indexOf(statuses[i])+1)%3];setStatuses(n);};
  async function genScript(){
    setLoading(true);setOut("");
    try{setOut(await claude(`Full DrBio-style video script for: "${scriptTopic}". Structure: 1) FACE HOOK (30 sec — Kannada opening line, PYQ reveal) 2) PYQ REVEAL ON IPAD (build suspense) 3) MAIN EXPLANATION (iPad drawing outline, live drawing notes) 4) PYQ ANSWERS + EXAM CORNER 5) CTA + PRODUCT (1 product only, DPP link) 6) SPECIMEN REEL IDEA (if botanical). Plus: thumbnail concept, SEO title, description (100 words), 10 tags.`,"You are DrBio's scriptwriter. Match his iPad-teaching style: conversational, Kannada-English, high-energy, exam-obsessed."));}catch(e){setOut("Error: "+e.message);}
    setLoading(false);
  }
  return(<div>
    <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
      {["calendar","checklist","recording","editing","script gen"].map(t=><span key={t} style={s.cmdBadge(subtab===t)} onClick={()=>setSubtab(t)}>{t.charAt(0).toUpperCase()+t.slice(1)}</span>)}
    </div>
    {subtab==="calendar"&&<div>
      <div style={{...s.sectionTitle,marginTop:0}}>Week 1 — Launch Week: The Living World</div>
      <div style={s.tableWrap}><table style={{width:"100%",borderCollapse:"collapse",minWidth:700}}>
        <thead><tr>{["Day","Date","Platform","Format","Topic","Face Setup","Status","Notes"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
        <tbody>{WEEK1.map((row,i)=>(
          <tr key={i}>
            <td style={{...s.td,color:green,fontWeight:500}}>{row.day}</td>
            <td style={s.td}>{row.date}</td>
            <td style={s.td}><span style={s.platformPill(row.platform)}>{row.platform}</span></td>
            <td style={{...s.td,fontSize:11}}>{row.format}</td>
            <td style={{...s.td,maxWidth:180,fontSize:12}}>{row.topic}</td>
            <td style={{...s.td,fontSize:11,color:textSec}}>{row.face}</td>
            <td style={s.td} onClick={()=>cycleStatus(i)} title="Click to cycle status"><span style={{cursor:"pointer",display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:"50%",background:s.statusColor(statuses[i]),display:"inline-block"}}/><span style={{fontSize:11,color:s.statusColor(statuses[i])}}>{statuses[i]}</span></span></td>
            <td style={{...s.td,fontSize:11,color:textSec,maxWidth:160}}>{row.notes}</td>
          </tr>
        ))}</tbody>
      </table></div>
      <div style={{marginTop:10,fontSize:11,color:muted}}>Click Status to cycle: Plan → In Progress → Done</div>
    </div>}
    {subtab==="checklist"&&<div>
      <div style={{...s.sectionTitle,marginTop:0}}>Pre-Production Checklist</div>
      {CHECKLIST.map((item,i)=><div key={i} style={s.checkRow(checks[i])} onClick={()=>toggle(checks,setChecks,i)}>
        <div style={{width:20,height:20,borderRadius:4,border:`1.5px solid ${checks[i]?green:border}`,background:checks[i]?green:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>
          {checks[i]&&<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#021a0a" strokeWidth="2" fill="none" strokeLinecap="round"/></svg>}
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:500,color:checks[i]?"#3a6a50":"#c0e8d0",marginBottom:3}}>Step {item.step}: {item.task}</div>
          <div style={{display:"flex",gap:16,fontSize:11,color:muted,flexWrap:"wrap"}}><span>{item.tool}</span><span style={{color:green}}>{item.time}</span><span>→ {item.output}</span></div>
        </div>
      </div>)}
    </div>}
    {subtab==="recording"&&<div>
      <div style={{...s.sectionTitle,marginTop:0}}>Recording Order</div>
      {RECORDING.map((item,i)=><div key={i} style={{...s.infoCard,display:"flex",gap:14,opacity:recChecks[i]?0.5:1,cursor:"pointer"}} onClick={()=>toggle(recChecks,setRecChecks,i)}>
        <div style={{width:36,height:36,borderRadius:8,background:recChecks[i]?green+"30":"#0d1f16",border:`1.5px solid ${recChecks[i]?green:border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:500,color:green,flexShrink:0}}>{item.order}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:500,color:"#c0e8d0",marginBottom:4}}>{item.segment}</div>
          <div style={{fontSize:12,color:textSec,marginBottom:4}}>{item.setup}</div>
          <div style={{display:"flex",gap:12,fontSize:11,flexWrap:"wrap"}}><span style={{color:green}}>{item.duration}</span><span style={{color:"#8ab8a0"}}>{item.tip}</span></div>
        </div>
      </div>)}
    </div>}
    {subtab==="editing"&&<div>
      <div style={{...s.sectionTitle,marginTop:0}}>Editing Non-Negotiables</div>
      {EDITING_RULES.map((item,i)=><div key={i} style={{...s.infoCard,borderLeft:`3px solid ${editChecks[i]?green:border}`,opacity:editChecks[i]?0.5:1,cursor:"pointer"}} onClick={()=>toggle(editChecks,setEditChecks,i)}>
        <div style={{fontSize:13,fontWeight:500,color:"#c0e8d0",marginBottom:5}}>{editChecks[i]?"✓ ":""}{item.rule}</div>
        <div style={{fontSize:12,color:textSec,marginBottom:4}}><span style={{color:muted}}>Why: </span>{item.why}</div>
        <div style={{fontSize:12,color:"#8ab8a0"}}><span style={{color:muted}}>How: </span>{item.how}</div>
      </div>)}
    </div>}
    {subtab==="script gen"&&<div>
      <div style={{...s.sectionTitle,marginTop:0}}>AI Script Generator — DrBio Style</div>
      <label style={s.lbl}>Topic / Chapter</label>
      <input style={s.inp} value={scriptTopic} onChange={e=>setScriptTopic(e.target.value)} placeholder="e.g. Photosynthesis — Light Reactions (Ch 13)"/>
      <button style={s.btn} onClick={genScript} disabled={loading||!scriptTopic.trim()}>{loading?<><Loader/>Writing script...</>:"Generate Full Script"}</button>
      {out&&<div style={s.out}>{out}<div style={{marginTop:12}}><button style={s.btnSm} onClick={()=>navigator.clipboard?.writeText(out)}>Copy script</button></div></div>}
    </div>}
  </div>);
}

// ── CHANNEL STRATEGY ────────────────────────────────────────────────────

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
      {pillars.map((p,i)=><div key={i} style={{...s.infoCard,borderLeft:`3px solid ${p.color}`}}>
